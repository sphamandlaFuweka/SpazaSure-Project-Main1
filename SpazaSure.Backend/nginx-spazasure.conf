server {
    listen 80;
    listen [::]:80;
    server_name api.spazasure.co.za;
    # Nginx's default is 1MB, which rejected banners and documents before they reached the API
    # (browsers report that as a network error). The largest API upload limit is 10MB, plus form overhead.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.spazasure.co.za;
    # Security headers (also set by the API gateway for api.spazasure.co.za)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/spazasure-admin;
    index index.html;

    # Speed: compress text files, and let browsers keep files that never change.
    # Vite puts a content hash in every /assets/ file name, so a new release always gets new names.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        # index.html must always be fresh so a new release shows up immediately
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}

