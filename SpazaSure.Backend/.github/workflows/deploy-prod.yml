# Triggers on a version tag push (e.g. git tag v1.2.3 && git push --tags)
# Required GitHub Secrets: PROD_HOST, PROD_SSH_USER, PROD_SSH_KEY,
#   PROD_DB_PASSWORD, PROD_RABBITMQ_PASSWORD, PROD_JWT_SECRET,
#   PROD_AT_USERNAME, PROD_AT_API_KEY

name: Deploy to Production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore SpazaSure.Backend.sln
      - run: dotnet build SpazaSure.Backend.sln --no-restore -c Release
      - run: dotnet test tests/SpazaSure.Tests/SpazaSure.Tests.csproj --no-build -c Release

  build-and-push:
    name: Build and Push Production Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/SpazaSure.AuthService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-auth:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/spazasure-auth:latest
      - name: Build and push product-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/SpazaSure.ProductService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-product:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/spazasure-product:latest
      - name: Build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/SpazaSure.OrderService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-order:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/spazasure-order:latest
      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/SpazaSure.NotificationService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-notification:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/spazasure-notification:latest
      - name: Build and push analytics-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/SpazaSure.AnalyticsService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-analytics:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/spazasure-analytics:latest
      - name: Build and push compliance-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/SpazaSure.ComplianceService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-compliance:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/spazasure-compliance:latest
      - name: Build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/SpazaSure.UserService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-user:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/spazasure-user:latest
      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Gateway/SpazaSure.Gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-gateway:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/spazasure-gateway:latest

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy production deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          source:   docker-compose.prod.yml,migrate.sql
          target:   /opt/spazasure/
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_RABBITMQ_PASSWORD: ${{ secrets.PROD_RABBITMQ_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          PROD_AT_USERNAME: ${{ secrets.PROD_AT_USERNAME }}
          PROD_AT_API_KEY: ${{ secrets.PROD_AT_API_KEY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          envs: PROD_DB_PASSWORD,PROD_RABBITMQ_PASSWORD,PROD_JWT_SECRET,PROD_AT_USERNAME,PROD_AT_API_KEY,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd /opt/spazasure
            umask 077
            trap 'rm -f .env.prod; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf "PROD_DB_PASSWORD=%s\nPROD_RABBITMQ_PASSWORD=%s\nPROD_JWT_SECRET=%s\nPROD_AT_USERNAME=%s\nPROD_AT_API_KEY=%s\nREGISTRY=ghcr.io/${{ github.repository_owner }}\nIMAGE_TAG=${{ github.ref_name }}\n" \
              "$PROD_DB_PASSWORD" "$PROD_RABBITMQ_PASSWORD" "$PROD_JWT_SECRET" "$PROD_AT_USERNAME" "$PROD_AT_API_KEY" > .env.prod
            compose='docker compose -f docker-compose.prod.yml --env-file .env.prod'
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            $compose pull
            docker logout ghcr.io >/dev/null
            $compose up -d postgres rabbitmq
            database_ready=false
            for attempt in $(seq 1 30); do
              if $compose exec -T postgres pg_isready -U spazasure_prod_user -d spazasure >/dev/null 2>&1; then
                database_ready=true
                break
              fi
              sleep 2
            done
            if [ "$database_ready" != true ]; then
              echo 'PostgreSQL did not become ready.'
              $compose ps
              exit 1
            fi
            $compose rm -f db-init
            $compose up --no-deps --abort-on-container-exit --exit-code-from db-init db-init
            $compose up -d --remove-orphans auth-service product-service order-service user-service notification-service analytics-service compliance-service gateway
