# docker-compose.qa.yml
# Run: docker compose -f docker-compose.qa.yml up -d
# Requires: .env.qa file at repo root with secrets

services:

  postgres:
    image: postgres:16-alpine
    container_name: spazasure-qa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       spazasure_qa
      POSTGRES_USER:     spazasure_qa_user
      POSTGRES_PASSWORD: ${QA_DB_PASSWORD}
    volumes:
      - qa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spazasure_qa_user -d spazasure_qa"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: spazasure-qa-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: spazasure
      RABBITMQ_DEFAULT_PASS: ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
    ports:
      - "15672:15672"
    volumes:
      - qa_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  db-init:
    image: postgres:16-alpine
    container_name: spazasure-qa-db-init
    restart: "no"
    environment:
      PGPASSWORD: ${QA_DB_PASSWORD}
    volumes:
      - ./migrate.sql:/migrations/migrate.sql:ro
    command:
      - sh
      - -c
      - psql -v ON_ERROR_STOP=1 -h postgres -U spazasure_qa_user -d spazasure_qa -f /migrations/migrate.sql
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: src/Services/SpazaSure.AuthService/Dockerfile
    container_name: spazasure-qa-auth
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT:               QA
      ASPNETCORE_URLS:                      http://+:5001
      Urls:                                 http://+:5001
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure_qa;Username=spazasure_qa_user;Password=${QA_DB_PASSWORD}"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
      Jwt__Secret:                          ${QA_JWT_SECRET}
      Jwt__AccessExpiryMinutes:             "60"
      Jwt__RefreshExpiryDays:               "30"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  product-service:
    build:
      context: .
      dockerfile: src/Services/SpazaSure.ProductService/Dockerfile
    container_name: spazasure-qa-product
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT:               QA
      PublicApiUrl:                         ${QA_PUBLIC_API_URL:-}
      ASPNETCORE_URLS:                      http://+:5002
      Urls:                                 http://+:5002
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure_qa;Username=spazasure_qa_user;Password=${QA_DB_PASSWORD}"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
      Jwt__Secret:                          ${QA_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  order-service:
    build:
      context: .
      dockerfile: src/Services/SpazaSure.OrderService/Dockerfile
    container_name: spazasure-qa-order
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT:               QA
      PublicApiUrl:                         ${QA_PUBLIC_API_URL:-}
      ASPNETCORE_URLS:                      http://+:5003
      Urls:                                 http://+:5003
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure_qa;Username=spazasure_qa_user;Password=${QA_DB_PASSWORD}"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
      Jwt__Secret:                          ${QA_JWT_SECRET}
      Paystack__SecretKey:                  ${QA_PAYSTACK_SECRET_KEY:-}
      Paystack__CallbackUrls__ShopCheckout: ${QA_PAYSTACK_SHOP_CALLBACK_URL:-https://qa.example.com/?payment=success}
      DeliveryPricing__BaseFee:             "50"
      DeliveryPricing__PerKmRate:            "8"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  user-service:
    build:
      context: .
      dockerfile: src/Services/SpazaSure.UserService/Dockerfile
    container_name: spazasure-qa-user
    restart: unless-stopped
    volumes:
      - qa_uploads:/app/uploads
    environment:
      ASPNETCORE_ENVIRONMENT:               QA
      PublicApiUrl:                         ${QA_PUBLIC_API_URL:-}
      ASPNETCORE_URLS:                      http://+:5005
      Urls:                                 http://+:5005
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure_qa;Username=spazasure_qa_user;Password=${QA_DB_PASSWORD}"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
      Jwt__Secret:                          ${QA_JWT_SECRET}
      Paystack__SecretKey:                  ${QA_PAYSTACK_SECRET_KEY:-}
      Paystack__CallbackUrls__ShopCheckout: ${QA_PAYSTACK_SHOP_CALLBACK_URL:-https://qa.example.com/?payment=success}
      Paystack__CallbackUrls__CustomerSubscription: ${QA_PAYSTACK_CUSTOMER_CALLBACK_URL:-https://qa.example.com/?payment=success}
      Paystack__CallbackUrls__SupplierSubscription: ${QA_PAYSTACK_SUPPLIER_CALLBACK_URL:-https://qa.example.com/subscription?payment=success}
      Paystack__PlanCodes__CustomerPlusMonthly: ${QA_PAYSTACK_PLAN_CUSTOMER_PLUS_MONTHLY:-}
      Paystack__PlanCodes__SupplierBronzeMonthly: ${QA_PAYSTACK_PLAN_SUPPLIER_BRONZE_MONTHLY:-}
      Paystack__PlanCodes__SupplierBronzeAnnual: ${QA_PAYSTACK_PLAN_SUPPLIER_BRONZE_ANNUAL:-}
      Paystack__PlanCodes__SupplierSilverMonthly: ${QA_PAYSTACK_PLAN_SUPPLIER_SILVER_MONTHLY:-}
      Paystack__PlanCodes__SupplierSilverAnnual: ${QA_PAYSTACK_PLAN_SUPPLIER_SILVER_ANNUAL:-}
      Paystack__PlanCodes__SupplierGoldMonthly: ${QA_PAYSTACK_PLAN_SUPPLIER_GOLD_MONTHLY:-}
      Paystack__PlanCodes__SupplierGoldAnnual: ${QA_PAYSTACK_PLAN_SUPPLIER_GOLD_ANNUAL:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: src/Services/SpazaSure.NotificationService/Dockerfile
    container_name: spazasure-qa-notification
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT:               QA
      ASPNETCORE_URLS:                      http://+:5184
      Urls:                                 http://+:5184
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure_qa;Username=spazasure_qa_user;Password=${QA_DB_PASSWORD}"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
      Jwt__Secret:                          ${QA_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  analytics-service:
    build:
      context: .
      dockerfile: src/Services/SpazaSure.AnalyticsService/Dockerfile
    container_name: spazasure-qa-analytics
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT:               QA
      ASPNETCORE_URLS:                      http://+:5004
      Urls:                                 http://+:5004
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure_qa;Username=spazasure_qa_user;Password=${QA_DB_PASSWORD}"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
      Jwt__Secret:                          ${QA_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  compliance-service:
    build:
      context: .
      dockerfile: src/Services/SpazaSure.ComplianceService/Dockerfile
    container_name: spazasure-qa-compliance
    restart: unless-stopped
    volumes:
      - qa_compliance_uploads:/app/uploads
    environment:
      ASPNETCORE_ENVIRONMENT:               QA
      ASPNETCORE_URLS:                      http://+:5006
      Urls:                                 http://+:5006
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure_qa;Username=spazasure_qa_user;Password=${QA_DB_PASSWORD}"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
      Jwt__Secret:                          ${QA_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # Drivers, allocating them to orders and live tracking
  delivery-service:
    build:
      context: .
      dockerfile: src/Services/SpazaSure.DeliveryService/Dockerfile
    container_name: spazasure-qa-delivery
    restart: unless-stopped
    volumes:
      - qa_delivery_uploads:/app/uploads
    environment:
      ASPNETCORE_ENVIRONMENT:               QA
      ASPNETCORE_URLS:                      http://+:5141
      Urls:                                 http://+:5141
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure_qa;Username=spazasure_qa_user;Password=${QA_DB_PASSWORD}"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
      Jwt__Secret:                          ${QA_JWT_SECRET}
      PublicApiUrl:                         ${QA_PUBLIC_API_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # Tax invoices (PDF) for orders
  payment-service:
    build:
      context: .
      dockerfile: src/Services/SpazaSure.PaymentService/Dockerfile
    container_name: spazasure-qa-payment
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT:               QA
      ASPNETCORE_URLS:                      http://+:5038
      Urls:                                 http://+:5038
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure_qa;Username=spazasure_qa_user;Password=${QA_DB_PASSWORD}"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
      Jwt__Secret:                          ${QA_JWT_SECRET}
      PublicApiUrl:                         ${QA_PUBLIC_API_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # Public checks for invoices and drivers
  verification-service:
    build:
      context: .
      dockerfile: src/Services/SpazaSure.VerificationService/Dockerfile
    container_name: spazasure-qa-verification
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT:               QA
      ASPNETCORE_URLS:                      http://+:5000
      Urls:                                 http://+:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure_qa;Username=spazasure_qa_user;Password=${QA_DB_PASSWORD}"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${QA_RABBITMQ_PASSWORD:-SpazaRabbitQA2026}
      Jwt__Secret:                          ${QA_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/SpazaSure.Gateway/Dockerfile
    container_name: spazasure-qa-gateway
    restart: unless-stopped
    ports:
      - "5181:5181"
    environment:
      ASPNETCORE_ENVIRONMENT: QA
    depends_on:
      - auth-service
      - product-service
      - order-service
      - user-service
      - notification-service
      - analytics-service
      - compliance-service
      - delivery-service
      - payment-service
      - verification-service

volumes:
  qa_postgres_data:
  qa_uploads:
  qa_compliance_uploads:
  qa_delivery_uploads:
  qa_rabbitmq_data:
