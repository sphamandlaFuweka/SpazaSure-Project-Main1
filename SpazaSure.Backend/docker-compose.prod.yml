# docker-compose.prod.yml
# Run: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# Requires: .env.prod file at repo root (never commit this file)

services:

  postgres:
    image: postgres:16-alpine
    container_name: spazasure-prod-db
    restart: always
    environment:
      POSTGRES_DB:       spazasure
      POSTGRES_USER:     spazasure_prod_user
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:?PROD_DB_PASSWORD must be set in .env.prod}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spazasure_prod_user -d spazasure"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:16-alpine
    container_name: spazasure-prod-db-init
    restart: "no"
    environment:
      PGPASSWORD: ${PROD_DB_PASSWORD:?PROD_DB_PASSWORD must be set in .env.prod}
    volumes:
      - ./migrate.sql:/migrations/migrate.sql:ro
    command:
      - sh
      - -c
      - psql -v ON_ERROR_STOP=1 -h postgres -U spazasure_prod_user -d spazasure -f /migrations/migrate.sql
    depends_on:
      postgres:
        condition: service_healthy

  postgres-backup:
    image: postgres:16-alpine
    container_name: spazasure-prod-db-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: spazasure
      PGUSER: spazasure_prod_user
      PGPASSWORD: ${PROD_DB_PASSWORD:?PROD_DB_PASSWORD must be set in .env.prod}
      BACKUP_RETENTION_DAYS: ${PROD_BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${PROD_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./backup-postgres.sh:/scripts/backup-postgres.sh:ro
    entrypoint: ["/bin/sh", "/scripts/backup-postgres.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: spazasure-prod-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: spazasure
      RABBITMQ_DEFAULT_PASS: ${PROD_RABBITMQ_PASSWORD:?PROD_RABBITMQ_PASSWORD must be set in .env.prod}
    volumes:
      - prod_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  auth-service:
    image: ${REGISTRY:?REGISTRY must be set}/spazasure-auth:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: spazasure-prod-auth
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT:               Production
      ASPNETCORE_URLS:                      http://+:5001
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure;Username=spazasure_prod_user;Password=${PROD_DB_PASSWORD};SSL Mode=Disable"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${PROD_RABBITMQ_PASSWORD:?PROD_RABBITMQ_PASSWORD must be set in .env.prod}
      Jwt__Secret:                          ${PROD_JWT_SECRET}
      Jwt__AccessExpiryMinutes:             "30"
      Jwt__RefreshExpiryDays:               "14"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  product-service:
    image: ${REGISTRY:?REGISTRY must be set}/spazasure-product:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: spazasure-prod-product
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT:               Production
      ASPNETCORE_URLS:                      http://+:5002
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure;Username=spazasure_prod_user;Password=${PROD_DB_PASSWORD};SSL Mode=Disable"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${PROD_RABBITMQ_PASSWORD:?PROD_RABBITMQ_PASSWORD must be set in .env.prod}
      Jwt__Secret:                          ${PROD_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  order-service:
    image: ${REGISTRY:?REGISTRY must be set}/spazasure-order:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: spazasure-prod-order
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT:               Production
      ASPNETCORE_URLS:                      http://+:5003
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure;Username=spazasure_prod_user;Password=${PROD_DB_PASSWORD};SSL Mode=Disable"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${PROD_RABBITMQ_PASSWORD:?PROD_RABBITMQ_PASSWORD must be set in .env.prod}
      Jwt__Secret:                          ${PROD_JWT_SECRET}
      Paystack__SecretKey:                  ${PROD_PAYSTACK_SECRET_KEY:-}
      Paystack__CallbackUrls__ShopCheckout: ${PROD_PAYSTACK_SHOP_CALLBACK_URL:-https://app.spazasure.co.za/?payment=success}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  user-service:
    image: ${REGISTRY:?REGISTRY must be set}/spazasure-user:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: spazasure-prod-user
    restart: always
    volumes:
      - prod_uploads:/app/uploads
    environment:
      ASPNETCORE_ENVIRONMENT:               Production
      ASPNETCORE_URLS:                      http://+:5005
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure;Username=spazasure_prod_user;Password=${PROD_DB_PASSWORD};SSL Mode=Disable"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${PROD_RABBITMQ_PASSWORD:?PROD_RABBITMQ_PASSWORD must be set in .env.prod}
      Jwt__Secret:                          ${PROD_JWT_SECRET}
      Paystack__SecretKey:                  ${PROD_PAYSTACK_SECRET_KEY:-}
      Paystack__CallbackUrls__ShopCheckout: ${PROD_PAYSTACK_SHOP_CALLBACK_URL:-https://app.spazasure.co.za/?payment=success}
      Paystack__CallbackUrls__CustomerSubscription: ${PROD_PAYSTACK_CUSTOMER_CALLBACK_URL:-https://app.spazasure.co.za/?payment=success}
      Paystack__CallbackUrls__SupplierSubscription: ${PROD_PAYSTACK_SUPPLIER_CALLBACK_URL:-https://portal.spazasure.co.za/subscription?payment=success}
      Paystack__PlanCodes__CustomerPlusMonthly: ${PROD_PAYSTACK_PLAN_CUSTOMER_PLUS_MONTHLY:-}
      Paystack__PlanCodes__SupplierBronzeMonthly: ${PROD_PAYSTACK_PLAN_SUPPLIER_BRONZE_MONTHLY:-}
      Paystack__PlanCodes__SupplierBronzeAnnual: ${PROD_PAYSTACK_PLAN_SUPPLIER_BRONZE_ANNUAL:-}
      Paystack__PlanCodes__SupplierSilverMonthly: ${PROD_PAYSTACK_PLAN_SUPPLIER_SILVER_MONTHLY:-}
      Paystack__PlanCodes__SupplierSilverAnnual: ${PROD_PAYSTACK_PLAN_SUPPLIER_SILVER_ANNUAL:-}
      Paystack__PlanCodes__SupplierGoldMonthly: ${PROD_PAYSTACK_PLAN_SUPPLIER_GOLD_MONTHLY:-}
      Paystack__PlanCodes__SupplierGoldAnnual: ${PROD_PAYSTACK_PLAN_SUPPLIER_GOLD_ANNUAL:-}
      # Object storage — see appsettings.Production.json for the defaults
      # these override. The `prod_uploads` volume above becomes an unused
      # fallback once this is set; it's kept only so Storage__Provider can
      # be flipped back to "local" without editing the compose file, e.g.
      # for a single-VPS deployment where a Docker volume actually persists.
      Storage__Provider:                    ${PROD_STORAGE_PROVIDER:-local}
      Storage__S3__BucketName:              ${PROD_S3_BUCKET_NAME}
      Storage__S3__ServiceUrl:              ${PROD_S3_SERVICE_URL}
      Storage__S3__Region:                  ${PROD_S3_REGION:-auto}
      Storage__S3__AccessKey:               ${PROD_S3_ACCESS_KEY}
      Storage__S3__SecretKey:               ${PROD_S3_SECRET_KEY}
      Storage__S3__PublicBaseUrl:           ${PROD_S3_PUBLIC_URL}
      Storage__S3__ForcePathStyle:          "true"
      Storage__S3__UsePublicReadAcl:        "false"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notification-service:
    image: ${REGISTRY:?REGISTRY must be set}/spazasure-notification:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: spazasure-prod-notification
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT:               Production
      ASPNETCORE_URLS:                      http://+:5184
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure;Username=spazasure_prod_user;Password=${PROD_DB_PASSWORD};SSL Mode=Disable"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${PROD_RABBITMQ_PASSWORD:?PROD_RABBITMQ_PASSWORD must be set in .env.prod}
      Jwt__Secret:                          ${PROD_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  analytics-service:
    image: ${REGISTRY:?REGISTRY must be set}/spazasure-analytics:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: spazasure-prod-analytics
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT:               Production
      ASPNETCORE_URLS:                      http://+:5004
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure;Username=spazasure_prod_user;Password=${PROD_DB_PASSWORD};SSL Mode=Disable"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${PROD_RABBITMQ_PASSWORD:?PROD_RABBITMQ_PASSWORD must be set in .env.prod}
      Jwt__Secret:                          ${PROD_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  compliance-service:
    image: ${REGISTRY:?REGISTRY must be set}/spazasure-compliance:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: spazasure-prod-compliance
    restart: always
    volumes:
      - prod_compliance_uploads:/app/uploads
    environment:
      ASPNETCORE_ENVIRONMENT:               Production
      ASPNETCORE_URLS:                      http://+:5006
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=spazasure;Username=spazasure_prod_user;Password=${PROD_DB_PASSWORD};SSL Mode=Disable"
      RabbitMQ__Host:                       rabbitmq
      RabbitMQ__Username:                   spazasure
      RabbitMQ__Password:                   ${PROD_RABBITMQ_PASSWORD:?PROD_RABBITMQ_PASSWORD must be set in .env.prod}
      Jwt__Secret:                          ${PROD_JWT_SECRET}
      # Report evidence photos — same S3 bucket as UserService's uploads.
      Storage__Provider:                    ${PROD_STORAGE_PROVIDER:-local}
      Storage__S3__BucketName:              ${PROD_S3_BUCKET_NAME}
      Storage__S3__ServiceUrl:              ${PROD_S3_SERVICE_URL}
      Storage__S3__Region:                  ${PROD_S3_REGION:-auto}
      Storage__S3__AccessKey:               ${PROD_S3_ACCESS_KEY}
      Storage__S3__SecretKey:               ${PROD_S3_SECRET_KEY}
      Storage__S3__PublicBaseUrl:           ${PROD_S3_PUBLIC_URL}
      Storage__S3__ForcePathStyle:          "true"
      Storage__S3__UsePublicReadAcl:        "false"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  gateway:
    image: ${REGISTRY:?REGISTRY must be set}/spazasure-gateway:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: spazasure-prod-gateway
    restart: always
    ports:
      - "127.0.0.1:5181:5181"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5181
      # Overrides the AllowedOrigins list baked into appsettings.Production.json —
      Cors__AllowedOrigins__0: ${PROD_FRONTEND_URL:-https://app.spazasure.co.za}
      Cors__AllowedOrigins__1: ${PROD_SUPPLIER_PORTAL_URL:-https://portal.spazasure.co.za}
    depends_on:
      - auth-service
      - product-service
      - order-service
      - user-service
      - notification-service
      - analytics-service
      - compliance-service

volumes:
  prod_postgres_data:
  prod_uploads:
  prod_compliance_uploads:
  prod_rabbitmq_data:

# Note: SpazaSure.PaymentService, SpazaSure.DeliveryService, and
# SpazaSure.VerificationService are NOT included above — they're empty
# scaffold projects (default `dotnet new webapi` boilerplate, no
# controllers, not referenced by the Gateway's routing config). Payment
# logic actually lives in UserService's PaymentController, and delivery
# pricing lives in OrderService's DeliveryPricingService. Don't deploy
# these three unless you've actually built real functionality into them
# first — right now they'd just be dead containers burning compute.
