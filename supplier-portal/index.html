<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpazaSure – Supplier Portal</title>
    <link rel="icon" type="image/png" href="/spazasure_logo.png" />
    <link rel="apple-touch-icon" href="/spazasure_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#25449A" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Tints map tiles in SpazaSure navy (see .brand-map in index.css) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="brand-map-tint" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.1818 0.6116 0.0617 0 0.1451
                                              0.1559 0.5245 0.0529 0 0.2667
                                              0.0842 0.2834 0.0286 0 0.6039
                                              0      0      0      1 0" />
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
