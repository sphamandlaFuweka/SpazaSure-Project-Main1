name: Deploy to QA

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet restore SpazaSure.Backend.sln
      - run: dotnet build SpazaSure.Backend.sln --no-restore -c Release
      - run: dotnet test tests/SpazaSure.Tests/SpazaSure.Tests.csproj --no-build -c Release

  deploy:
    name: Deploy and Verify QA
    runs-on: ubuntu-latest
    needs: test
    environment: qa
    steps:
      - name: Deploy on QA server
        uses: appleboy/ssh-action@v1.0.3
        env:
          QA_DB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          QA_JWT_SECRET: ${{ secrets.QA_JWT_SECRET }}
          QA_AT_API_KEY: ${{ secrets.QA_AT_API_KEY }}
          QA_RABBITMQ_PASSWORD: ${{ secrets.QA_RABBITMQ_PASSWORD }}
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          envs: QA_DB_PASSWORD,QA_JWT_SECRET,QA_AT_API_KEY,QA_RABBITMQ_PASSWORD
          script: |
            set -eu
            cd /opt/spazasure/SpazaSure.Backend

            git fetch origin develop
            git reset --hard origin/develop

            umask 077
            {
              printf 'QA_DB_PASSWORD=%s\n' "$QA_DB_PASSWORD"
              printf 'QA_JWT_SECRET=%s\n' "$QA_JWT_SECRET"
              printf 'QA_AT_API_KEY=%s\n' "$QA_AT_API_KEY"
              printf 'QA_RABBITMQ_PASSWORD=%s\n' "$QA_RABBITMQ_PASSWORD"
            } > .env.qa

            compose='docker compose -f docker-compose.qa.yml --env-file .env.qa'
            diagnostics() {
              $compose ps || true
              $compose logs --tail=150 gateway auth-service db-init postgres || true
            }

            $compose up -d postgres rabbitmq || { diagnostics; exit 1; }
            database_ready=false
            for attempt in $(seq 1 30); do
              if $compose exec -T postgres pg_isready -U spazasure_qa_user -d spazasure_qa >/dev/null 2>&1; then
                database_ready=true
                break
              fi
              sleep 2
            done
            if [ "$database_ready" != true ]; then
              echo 'PostgreSQL did not become ready.'
              diagnostics
              exit 1
            fi

            $compose rm -f db-init >/dev/null 2>&1 || true
            $compose up --no-deps --abort-on-container-exit --exit-code-from db-init db-init || { diagnostics; exit 1; }
            $compose up -d --build --remove-orphans auth-service product-service order-service user-service notification-service analytics-service compliance-service gateway || { diagnostics; exit 1; }

            suffix=$(date +%s)
            email="qa-smoke-${suffix}@spazasure.test"
            phone_suffix=$(printf '%s' "$suffix" | tail -c 9)
            phone="07${phone_suffix}"
            password="QaSmoke@${suffix}"
            register_payload=$(printf '{"role":"supplier","email":"%s","phone":"%s","password":"%s","companyName":"QA Smoke Test","contactPerson":"QA Pipeline"}' "$email" "$phone" "$password")
            login_payload=$(printf '{"email":"%s","password":"%s"}' "$email" "$password")

            registered=false
            for attempt in $(seq 1 30); do
              if register_response=$(curl --silent --show-error --fail -H 'Content-Type: application/json' -d "$register_payload" http://127.0.0.1:5181/api/supplier/auth/register) && printf '%s' "$register_response" | grep -q '"accessToken"'; then
                registered=true
                break
              fi
              sleep 5
            done

            if [ "$registered" != true ]; then
              echo 'QA registration smoke test failed.'
              diagnostics
              exit 1
            fi

            authenticated=false
            for attempt in $(seq 1 12); do
              if login_response=$(curl --silent --show-error --fail -H 'Content-Type: application/json' -d "$login_payload" http://127.0.0.1:5181/api/supplier/auth/login) && printf '%s' "$login_response" | grep -q '"accessToken"'; then
                authenticated=true
                break
              fi
              sleep 5
            done

            if [ "$authenticated" != true ]; then
              echo 'QA authentication smoke test failed.'
              diagnostics
              exit 1
            fi

            echo 'QA authentication smoke test passed.'
            $compose ps
            docker image prune -f
