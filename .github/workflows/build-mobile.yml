name: Build Mobile Apps (Android APK + iOS IPA)

on:
  workflow_dispatch:  # Manual trigger from GitHub UI
  push:
    branches: [qa, main]
    paths:
      - 'spazasure_app/**'
      - '.github/workflows/build-mobile.yml'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # must satisfy pubspec.lock's flutter constraint
          channel: 'stable'

      - name: Get dependencies
        working-directory: spazasure_app
        run: flutter pub get

      - name: Configure Android signing
        working-directory: spazasure_app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD" ] && [ -z "$KEY_PASSWORD" ]; then
            # Google Play rejects debug-signed bundles, so main (the store build) must be properly signed
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              echo "::error::main builds go to Google Play and must be signed. Add ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_PASSWORD as repository secrets."
              exit 1
            fi
            echo "Android release signing secrets are not configured; using the debug-signing fallback for test builds."
            exit 0
          fi

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing requires ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEY_PASSWORD together."
            exit 1
          fi

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > spazasure-release.jks; then
            rm -f spazasure-release.jks
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi

          if [ ! -s spazasure-release.jks ] || ! keytool -list -keystore spazasure-release.jks -storepass "$KEYSTORE_PASSWORD" -alias spazasure >/dev/null 2>&1; then
            rm -f spazasure-release.jks
            echo "::error::The configured keystore is empty, unreadable, or does not contain alias 'spazasure'."
            exit 1
          fi

          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=spazasure\n'
            printf 'storeFile=spazasure-release.jks\n'
          } > key.properties

      - name: Build APK
        working-directory: spazasure_app
        run: flutter build apk --release

      - name: Build App Bundle
        working-directory: spazasure_app
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpazaSure-Android-APK
          path: spazasure_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SpazaSure-Android-AAB
          path: spazasure_app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # must satisfy pubspec.lock's flutter constraint
          channel: 'stable'

      - name: Get dependencies
        working-directory: spazasure_app
        run: flutter pub get

      - name: Build iOS (No Signing)
        working-directory: spazasure_app
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        working-directory: spazasure_app
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r SpazaSure.ipa Payload
          mv SpazaSure.ipa ../

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpazaSure-iOS-IPA
          path: spazasure_app/build/ios/SpazaSure.ipa
