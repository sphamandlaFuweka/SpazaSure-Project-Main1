name: Build Mobile Apps (Android + iOS)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      play_store_release:
        description: Require upload-key signing and produce a Play Store AAB
        type: boolean
        required: false
        default: false
  push:
    branches: [qa, main]
    paths:
      - 'spazasure_app/**'
      - '.github/workflows/build-mobile.yml'

jobs:
  test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spazasure_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # must satisfy pubspec.lock's flutter constraint
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build Android release artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # must satisfy pubspec.lock's flutter constraint
          channel: 'stable'

      - name: Get dependencies
        working-directory: spazasure_app
        run: flutter pub get

      - name: Configure Android signing
        working-directory: spazasure_app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAY_STORE_RELEASE: ${{ inputs.play_store_release }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD" ] && [ -z "$KEY_PASSWORD" ] && [ -z "$KEY_ALIAS" ]; then
            if [ "$PLAY_STORE_RELEASE" = "true" ]; then
              echo "::error::A Play Store release requires ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, and KEY_ALIAS repository secrets."
              exit 1
            fi
            echo "No upload key configured; this run will produce test-only, debug-signed artifacts."
            exit 0
          fi

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Android signing requires ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, and KEY_ALIAS together."
            exit 1
          fi

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > spazasure-release.jks; then
            rm -f spazasure-release.jks
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi

          if [ ! -s spazasure-release.jks ] || ! keytool -list -keystore spazasure-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            rm -f spazasure-release.jks
            echo "::error::The configured keystore is empty, unreadable, or does not contain the configured key alias."
            exit 1
          fi

          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=spazasure-release.jks\n'
          } > key.properties

      - name: Build split APKs for testing
        if: inputs.play_store_release != true
        working-directory: spazasure_app
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        working-directory: spazasure_app
        run: flutter build appbundle --release

      - name: Upload test APKs
        if: inputs.play_store_release != true
        uses: actions/upload-artifact@v4
        with:
          name: SpazaSure-Android-APK-CI-TEST-ONLY
          path: spazasure_app/build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload Play Store AAB
        if: github.event_name == 'workflow_dispatch' && inputs.play_store_release == true
        uses: actions/upload-artifact@v4
        with:
          name: SpazaSure-Play-Store-AAB
          path: spazasure_app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload test-only AAB
        if: inputs.play_store_release != true
        uses: actions/upload-artifact@v4
        with:
          name: SpazaSure-Android-AAB-CI-TEST-ONLY
          path: spazasure_app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # must satisfy pubspec.lock's flutter constraint
          channel: 'stable'

      - name: Get dependencies
        working-directory: spazasure_app
        run: flutter pub get

      - name: Install iOS pods
        working-directory: spazasure_app/ios
        run: pod install

      - name: Build iOS simulator
        working-directory: spazasure_app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Build iOS device app (No Signing)
        working-directory: spazasure_app
        run: flutter build ios --release --no-codesign

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: SpazaSure-iOS-unsigned-app
          path: spazasure_app/build/ios/iphoneos/Runner.app
