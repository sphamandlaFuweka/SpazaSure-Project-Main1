name: Supplier Portal - Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'supplier-portal/**'
      - '!supplier-portal/**.md'

concurrency:
  group: supplier-portal-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend (Production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supplier-portal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: supplier-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build for Production
        run: npm run build:prod

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplier-portal-prod-build
          path: supplier-portal/dist/
          retention-days: 30
