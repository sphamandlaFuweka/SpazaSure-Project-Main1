name: Supplier Portal - Build and Publish Image

# Builds the dashboard on a GitHub runner (the Hetzner server runs out of memory
# doing it) and publishes a small nginx image for Coolify to pull.

on:
  push:
    branches: [main]
    paths:
      - 'supplier-portal/**'
      - '!supplier-portal/**.md'
  workflow_dispatch:

concurrency:
  group: supplier-portal-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: supplier-portal/package-lock.json

      - name: Install dependencies
        working-directory: supplier-portal
        run: npm ci

      - name: Build for production
        working-directory: supplier-portal
        run: npm run build:prod

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: supplier-portal
          file: supplier-portal/Dockerfile.prebuilt
          push: true
          tags: |
            ghcr.io/sphamandlafuweka/spazasure-web-dashboard:latest
            ghcr.io/sphamandlafuweka/spazasure-web-dashboard:${{ github.sha }}
