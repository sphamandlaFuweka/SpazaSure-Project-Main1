name: Backend - Deploy to QA

on:
  push:
    branches: [develop]
    paths:
      - 'SpazaSure.Backend/**'
      - '.github/workflows/backend-qa.yml'
      - '!SpazaSure.Backend/**.md'

concurrency:
  group: backend-qa
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpazaSure.Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet restore SpazaSure.Backend.sln
      - run: dotnet build SpazaSure.Backend.sln --no-restore -c Release
      - run: dotnet test tests/SpazaSure.Tests/SpazaSure.Tests.csproj --no-build -c Release

  deploy:
    name: Deploy and Verify QA
    runs-on: ubuntu-latest
    needs: test
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - name: Copy backend source to QA
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          source: SpazaSure.Backend
          target: /opt/spazasure/
          overwrite: true
      - name: Deploy containers and verify authentication
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -u
            echo 'STAGE: preparing deployment directory'
            if ! cd /opt/spazasure/SpazaSure.Backend; then
              echo 'Backend deployment directory is missing.'
              exit 1
            fi

            echo 'STAGE: loading protected QA configuration'
            if [ -s ../.env.qa ] && grep -q '^QA_DB_PASSWORD=.' ../.env.qa && grep -q '^QA_JWT_SECRET=.' ../.env.qa; then
              cp ../.env.qa .env.qa
              chmod 600 .env.qa
            else
              echo 'STAGE: repairing protected QA configuration'
              auth_env=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' spazasure-qa-auth 2>/dev/null || true)
              rabbit_env=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' spazasure-qa-rabbitmq 2>/dev/null || true)
              at_api_key=$(printf '%s\n' "$auth_env" | sed -n 's/^AfricasTalking__ApiKey=//p' | head -n 1)
              rabbit_password=$(printf '%s\n' "$rabbit_env" | sed -n 's/^RABBITMQ_DEFAULT_PASS=//p' | head -n 1)
              [ -n "$rabbit_password" ] || rabbit_password='SpazaRabbitQA2026'
              db_password=$(openssl rand -hex 32)
              jwt_secret=$(openssl rand -hex 64)

              if ! docker exec spazasure-qa-db psql -v ON_ERROR_STOP=1 -U spazasure_qa_user -d spazasure_qa -c "ALTER ROLE spazasure_qa_user PASSWORD '$db_password';" >/dev/null; then
                echo 'Unable to reset the QA database role password.'
                exit 1
              fi

              umask 077
              {
                printf 'QA_DB_PASSWORD=%s\n' "$db_password"
                printf 'QA_JWT_SECRET=%s\n' "$jwt_secret"
                printf 'QA_AT_API_KEY=%s\n' "$at_api_key"
                printf 'QA_RABBITMQ_PASSWORD=%s\n' "$rabbit_password"
              } > .env.qa
              cp .env.qa ../.env.qa
              chmod 600 .env.qa ../.env.qa
            fi

            compose_project=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' spazasure-qa-db 2>/dev/null || true)
            [ -n "$compose_project" ] || compose_project='spazasure'
            compose="docker compose -p $compose_project -f docker-compose.qa.yml --env-file .env.qa"
            echo "STAGE: using existing Compose project $compose_project"
            diagnostics() {
              $compose ps || true
              $compose logs --tail=150 db-init auth-service gateway postgres || true
            }

            echo 'STAGE: starting infrastructure'
            $compose up -d postgres rabbitmq || { diagnostics; exit 1; }
            database_ready=false
            for attempt in $(seq 1 30); do
              if $compose exec -T postgres pg_isready -U spazasure_qa_user -d spazasure_qa >/dev/null 2>&1; then
                database_ready=true
                break
              fi
              sleep 2
            done
            if [ "$database_ready" != true ]; then
              echo 'PostgreSQL did not become ready.'
              diagnostics
              exit 1
            fi

            echo 'STAGE: applying database migration'
            $compose rm -f db-init >/dev/null 2>&1 || true
            $compose up --no-deps --abort-on-container-exit --exit-code-from db-init db-init || { diagnostics; exit 1; }
            echo 'STAGE: rebuilding application services'
            $compose up -d --build --remove-orphans auth-service product-service order-service user-service notification-service analytics-service compliance-service gateway || { diagnostics; exit 1; }

            suffix=$(date +%s)
            email="qa-smoke-${suffix}@spazasure.test"
            phone="07$(printf '%s' "$suffix" | tail -c 9)"
            password="QaSmoke@${suffix}"
            register_payload=$(printf '{"role":"supplier","email":"%s","phone":"%s","password":"%s","companyName":"QA Smoke Test","contactPerson":"QA Pipeline"}' "$email" "$phone" "$password")
            login_payload=$(printf '{"email":"%s","password":"%s"}' "$email" "$password")

            registered=false
            for attempt in $(seq 1 30); do
              if response=$(curl --silent --show-error --fail -H 'Content-Type: application/json' -d "$register_payload" http://127.0.0.1:5181/api/supplier/auth/register) && printf '%s' "$response" | grep -q '"accessToken"'; then
                registered=true
                break
              fi
              sleep 5
            done
            if [ "$registered" != true ]; then
              echo 'QA registration smoke test failed.'
              diagnostics
              exit 1
            fi

            authenticated=false
            for attempt in $(seq 1 12); do
              if response=$(curl --silent --show-error --fail -H 'Content-Type: application/json' -d "$login_payload" http://127.0.0.1:5181/api/supplier/auth/login) && printf '%s' "$response" | grep -q '"accessToken"'; then
                authenticated=true
                break
              fi
              sleep 5
            done
            if [ "$authenticated" != true ]; then
              echo 'QA authentication smoke test failed.'
              diagnostics
              exit 1
            fi

            echo 'QA authentication smoke test passed.'
            $compose ps