name: Backend - Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'SpazaSure.Backend/**'
      - '!SpazaSure.Backend/**.md'

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpazaSure.Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet restore SpazaSure.Backend.sln
      - run: dotnet build SpazaSure.Backend.sln --no-restore -c Release
      - run: dotnet test tests/SpazaSure.Tests/SpazaSure.Tests.csproj --no-build -c Release

  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./SpazaSure.Backend
          file: SpazaSure.Backend/src/Services/SpazaSure.AuthService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-auth:prod-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/spazasure-auth:latest
      - name: Build and push product-service
        uses: docker/build-push-action@v5
        with:
          context: ./SpazaSure.Backend
          file: SpazaSure.Backend/src/Services/SpazaSure.ProductService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-product:prod-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/spazasure-product:latest
      - name: Build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./SpazaSure.Backend
          file: SpazaSure.Backend/src/Services/SpazaSure.OrderService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-order:prod-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/spazasure-order:latest
      - name: Build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./SpazaSure.Backend
          file: SpazaSure.Backend/src/Services/SpazaSure.UserService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-user:prod-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/spazasure-user:latest
      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./SpazaSure.Backend
          file: SpazaSure.Backend/src/Services/SpazaSure.NotificationService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-notification:prod-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/spazasure-notification:latest
      - name: Build and push analytics-service
        uses: docker/build-push-action@v5
        with:
          context: ./SpazaSure.Backend
          file: SpazaSure.Backend/src/Services/SpazaSure.AnalyticsService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-analytics:prod-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/spazasure-analytics:latest
      - name: Build and push compliance-service
        uses: docker/build-push-action@v5
        with:
          context: ./SpazaSure.Backend
          file: SpazaSure.Backend/src/Services/SpazaSure.ComplianceService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-compliance:prod-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/spazasure-compliance:latest
      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./SpazaSure.Backend
          file: SpazaSure.Backend/src/Gateway/SpazaSure.Gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spazasure-gateway:prod-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/spazasure-gateway:latest

