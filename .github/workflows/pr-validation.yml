name: PR Validation

on:
  pull_request:
    branches: [develop, release, main]

jobs:
  # Supplier Portal validation
  supplier-portal:
    name: Validate Supplier Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supplier-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: supplier-portal/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build:qa
      - run: npm run build:admin:qa

  # Mobile app validation
  mobile-app:
    name: Validate Mobile App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spazasure_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # keep in step with build-mobile.yml
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Backend validation
  backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpazaSure.Backend
    steps:
      - uses: actions/checkout@v4
      # Malformed compose files (e.g. a key defined twice) fail here, not during a deploy.
      # --no-interpolate checks the structure without needing the secrets.
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.prod.yml config --no-interpolate --quiet
          docker compose -f docker-compose.qa.yml config --no-interpolate --quiet
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore SpazaSure.Backend.sln
      - run: dotnet build SpazaSure.Backend.sln --no-restore -c Release
      - run: dotnet test tests/SpazaSure.Tests/SpazaSure.Tests.csproj --no-build -c Release
